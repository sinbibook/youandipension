<div id="wrap">
    <div id="header-wrap"></div>
    <div class="scroll-wrap" id="doc" data-scroll-container="">
        <!-- s: container -->
        <div id="container">
            <!--// sub_visual -->
            <div class="sub_visual visual travel fadeDown" data-scroll="">
                <div class="visual_box">
                    <div class="swiper-container">
                        <!-- data-* : data-layout-map-hero-slides | pages.layoutMap.sections[0].hero.images[isSelected] (배경 슬라이드 rebuild) -->
                        <div class="swiper-wrapper" data-layout-map-hero-slides></div>
                    </div>
                </div>
            </div>
            <!--// sub_visual -->
            <!-- s: snb_wrap -->
            <div id="snb_wrap">
                <!-- data-* : data-room-list-nav | roomtypes[] (미리보기 li 뒤 동적 생성, room.html?room_id={id}) -->
                <ul data-room-list-nav>
                    <li class="on" data-menu-id="layout-map"><a href="layout-map.html">미리보기</a></li>
                </ul>
            </div>
            <!-- e: snb_wrap -->
            <!-- s: content -->
            <section id="content" class="sub">
                <!-- s: main_room -->
                <div class="main_room">
                    <div class="tits">
                        <h3 class="fadeUp" data-scroll="">Room</h3>
                        <p class="fadeUp" data-scroll="">Preview</p>
                    </div>
                    <div class="cont fadeUp" data-scroll="">
                        <div class="room">
                            <div class="swiper-container room-slide">
                                <!-- data-* : data-room-list-slides | roomtypes[] (객실 카드 동적 생성) -->
                                <div class="swiper-wrapper item" data-room-list-slides></div>
                            </div>
                        </div>
                        <div class="room-ctrl">
                            <a href="#n" class="room-prev" style="background:url(images/room_prev.png) no-repeat left center"><span>이전</span></a>
                            <div class="room-paging"></div>
                            <a href="#n" class="room-next" style="background:url(images/room_next.png) no-repeat right center"><span>다음</span></a>
                        </div>
                    </div>
                </div>
                <!-- e: main_room -->
                <div class="pre-wrap" id="direction">
                    <!-- data-* : data-layout-map-images | pages.layoutMap.sections[0].about.images[isSelected] (배치도 동적 생성) -->
                    <div class="vimg" data-layout-map-images></div>
                </div>
            </section>
            <!-- e: content -->
        </div>
        <!-- e: container -->
        <div id="footer-wrap"></div>
    </div><!-- e: scroll-wrap -->
</div><!-- e: wrap -->

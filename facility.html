<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" class="is-smooth-scroll-compatible is-loading">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta property="og:type" content="website">

    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css">
    <link rel="stylesheet" type="text/css" href="styles/reset.css">
    <link rel="stylesheet" type="text/css" href="styles/style.css">
    <link rel="stylesheet" type="text/css" href="styles/board_black.css">
    <link rel="stylesheet" type="text/css" href="styles/popup_black.css">
    <link rel="stylesheet" type="text/css" href="styles/swiper-bundle.min.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script type="text/javascript" src="js/swiper-bundle.min.js"></script>
    <script type="text/javascript" src="js/jquery.cookie.min.js"></script>
    <script type="text/javascript" src="js/ScrollTrigger.min.js"></script>
    <script type="text/javascript" src="js/gsap.min.js"></script>
    <script type="text/javascript" src="js/polyfill.min.js"></script>
    <script type="text/javascript" src="js/sly.js"></script>
    <script nomodule="" src="//polyfill.io/v3/polyfill.min.js?features=Object.assign%2CElement.prototype.append%2CNodeList.prototype.forEach%2CCustomEvent%2Csmoothscroll" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/locomotive-scroll.min.js"></script>
  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="영월 유앤아이 스파 펜션 - 시설안내" />
  <meta property="og:description" content="일상의 피로를 풀어 줄 따뜻한 스파와 감성을 채워 줄 불멍이 있는 영월 유앤아이 스파 펜션으로 놀러 오세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/27/uAdysbIawYSe.jpg" />
  <meta property="og:url" content="https://youandipension.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="영월 유앤아이 스파 펜션 - 시설안내" />
  <meta name="twitter:description" content="일상의 피로를 풀어 줄 따뜻한 스파와 감성을 채워 줄 불멍이 있는 영월 유앤아이 스파 펜션으로 놀러 오세요." />

</head>
<body>
<div id="wrap">
    <div id="header-wrap"></div>
    <div class="scroll-wrap" id="doc" data-scroll-container="">
        <!-- s: container -->
        <div id="container">
            <!--// sub_visual -->
            <div class="sub_visual visual fadeDown" data-scroll="">
                <div class="visual_box">
                    <div class="visual_control">
                        <div class="swiper-arw swiper-button-prev" style="background:url() no-repeat left center ;background-size:auto 100%;"></div>
                        <div class="paging swiper-pagination"></div>
                        <div class="swiper-arw swiper-button-next" style="background:url() no-repeat right center ;background-size:auto 100%;"></div>
                    </div>
                    <div class="swiper-container">
                        <!-- data-* : data-facility-hero-slides | facilities[current].images[isSelected] (배경 슬라이드 rebuild) -->
                        <div class="swiper-wrapper" data-facility-hero-slides></div>
                    </div>
                </div>
                <a href="#snb_wrap" class="scroll_down">scroll down</a>
            </div>
            <!--// sub_visual -->
            <!-- s: snb_wrap -->
            <div id="snb_wrap">
                <!-- data-* : data-facility-nav | facilities[] (동적 생성, 현재 active, facility.html?id={id}) -->
                <ul data-facility-nav></ul>
            </div>
            <!-- e: snb_wrap -->
            <!-- s: content -->
            <section id="content" class="sub">
                <!-- s: special-wrap -->
                <div class="special-wrap">
                    <div class="tits">
                        <!-- data-* : data-facility-name | facilities[current].name -->
                        <h3 class="fadeUp" data-scroll=""><span>Special</span><span data-facility-name></span></h3>
                        <!-- data-* : data-facility-description | facilities[current].description (\n→<br>) -->
                        <p class="fadeUp" data-scroll="" data-facility-description></p>
                    </div>
                    <div class="dimg">
                        <!-- data-* : data-facility-image | facilities[current].images[isSelected][0] (배경, 없으면 placeholder) -->
                        <div class="img fadeUp" data-scroll="" data-facility-image></div>
                        <!-- data-* : data-facility-name-en | property.nameEn (숙소 영문명) -->
                        <h4 class="fadeUp" data-scroll="" data-facility-name-en></h4>
                        <!-- data-* : data-facility-gallery | facilities[current].images[isSelected] (li 배경+img 동적, 없으면 placeholder) -->
                        <ul data-facility-gallery></ul>
                    </div>
                    <div class="vimg fadeUp" data-scroll="">
                        <div class="cont">
                            <div class="fl">
                                <!-- data-* : data-facility-slides | facilities[] (이미지 슬라이드 rebuild) -->
                                <div class="swiper-container spec-img">
                                    <div class="swiper-wrapper" data-facility-slides></div>
                                </div>
                            </div>
                            <div class="fr">
                                <!-- data-* : data-facility-titles | facilities[] (txt-con: btxt=name, stxt='Special,') -->
                                <div class="spec-tit" data-facility-titles></div>
                                <div class="swiper-container spec-txt">
                                    <!-- data-* : data-facility-texts | facilities[] (0N. name + description, facility.html?id={id}) -->
                                    <div class="swiper-wrapper" data-facility-texts></div>
                                    <div class="swiper-pagination"></div>
                                </div>
                            </div>
                            <div class="btns">
                                <a href="#n" class="spec-prev" style="background-image:url(images/special_prev.png)"></a>
                                <a href="#n" class="spec-next" style="background-image:url(images/special_next.png)"></a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- e: special-wrap -->
            </section>
            <!-- e: content -->
        </div>
        <!-- e: container -->
        <div id="footer-wrap"></div>
    </div><!-- e: scroll-wrap -->
</div><!-- e: wrap -->
<!-- infra: SEO/헤더·푸터 동적 + 데이터 매핑 -->
<script src="js/image-helpers.js"></script>
<script src="js/preview-handler.js"></script>
<script src="js/data-mapper/core/base-mapper.js"></script>
<script src="js/data-mapper/pages/header-footer-mapper.js"></script>
<script src="js/data-mapper/pages/facility-mapper.js"></script>
<script src="js/header-footer-loader.js"></script>
<script src="js/custom.js"></script>
</body>
</html>

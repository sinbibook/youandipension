<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="styles/theme.css">
    <link rel="stylesheet" type="text/css" href="styles/reset.css">
    <link rel="stylesheet" type="text/css" href="styles/style.css">
    <link rel="stylesheet" type="text/css" href="styles/board_black.css">
    <link rel="stylesheet" type="text/css" href="styles/popup_black.css">
    <link rel="stylesheet" type="text/css" href="styles/swiper-bundle.min.css">
    <script src="js/jquery.min.js"></script>

    <script type="text/javascript" src="js/swiper-bundle.min.js"></script>
    <script type="text/javascript" src="js/jquery.cookie.min.js"></script>

    <script type="text/javascript" src="js/sly.js"></script>
    <script nomodule="" src="//polyfill.io/v3/polyfill.min.js?features=Object.assign%2CElement.prototype.append%2CNodeList.prototype.forEach%2CCustomEvent%2Csmoothscroll" crossorigin="anonymous"></script>
    <script type="text/javascript" src="js/locomotive-scroll.min.js"></script>
  <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="영월 유앤아이 스파 펜션 - 객실안내" />
  <meta property="og:description" content="일상의 피로를 풀어 줄 따뜻한 스파와 감성을 채워 줄 불멍이 있는 영월 유앤아이 스파 펜션으로 놀러 오세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/27/uAdysbIawYSe.jpg" />
  <meta property="og:url" content="https://youandipension.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="영월 유앤아이 스파 펜션 - 객실안내" />
  <meta name="twitter:description" content="일상의 피로를 풀어 줄 따뜻한 스파와 감성을 채워 줄 불멍이 있는 영월 유앤아이 스파 펜션으로 놀러 오세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/27/uAdysbIawYSe.jpg" />

</head>
<body>
<div id="wrap">
    <div id="header-wrap"></div>
    <div class="scroll-wrap" id="doc" data-scroll-container="">
        <div id="container">
            <!--// sub_visual -->
            <div class="sub_visual visual fadeDown" data-scroll="">
                <div class="visual_box">
                    <div class="visual_control">
                        <div class="swiper-arw swiper-button-prev" style="background:url(images/visual_prev.png) no-repeat left center ;background-size:auto 100%;"></div>
                        <div class="paging swiper-pagination"></div>
                        <div class="swiper-arw swiper-button-next" style="background:url(images/visual_next.png) no-repeat right center ;background-size:auto 100%;"></div>
                    </div>
                    <div class="swiper-container">
                        <!-- data-* : data-room-hero-slides | roomtypes[current] interior 이미지[isSelected] (배경 슬라이드 rebuild) -->
                        <div class="swiper-wrapper" data-room-hero-slides></div>
                    </div>
                </div>
                <a href="#snb_wrap" class="scroll_down">scroll down</a>
            </div>
            <!--// sub_visual -->
            <!-- s: snb_wrap -->
            <div id="snb_wrap">
                <!-- data-* : data-room-list-nav | roomtypes[] (미리보기 li 보존 + 동적, 현재 객실 li.on, room.html?room_id={id}) -->
                <ul data-room-list-nav>
                    <li data-menu-id="layout-map"><a href="layout-map.html">미리보기</a></li>
                </ul>
            </div>
            <!-- e: snb_wrap -->
            <!-- s: content -->
            <section id="content" class="sub">
                <!-- s: room-wrap -->
                <div class="room-wrap">
                    <div class="info">
                        <div class="fl">
                            <div class="txt">
                                <!-- data-* : data-room-name | roomtypes[current].name -->
                                <h3 class="fadeUp" data-scroll=""><span>Rooms</span><span data-room-name></span></h3>
                                <!-- data-* : data-room-structure | rooms[j].roomStructures + totalRoomCount 한글 (id 매칭) -->
                                <p class="fadeUp" data-scroll="" data-room-structure></p>
                            </div>
                            <!-- data-* : data-room-image-thumb | roomtypes[current] interior 이미지(<img>) -->
                            <div class="img fadeUp" data-scroll="">
                                <!-- ⚠️ `src` 를 비워 두지 않는다. `src=""` 는 브라우저가 현재 페이지를 다시 요청한다.
                                     매퍼가 채우기 전까지 속성 자체를 두지 않는다. -->
                                <img alt="" data-room-image-thumb>
                            </div>
                            <!--dl class="fadeUp" data-scroll>
                                <dt><span>ROOM INFO</span></dt>
                                <dd> ※ 자세한 내용은 예약안내 페이지 참고 부탁드립니다.</dd>
                            </dl-->
                        </div>
                        <div class="fr">
                            <!-- data-* : data-room-image-main | roomtypes[current] interior 이미지 (배경, 없으면 placeholder) -->
                            <div class="img fadeLeft" data-scroll="" style="background-repeat:no-repeat;background-position:59% center;background-size:cover;" data-room-image-main></div>
                        </div>
                        <div class="table_box">
                            <div class="price_table for_pc">
                                <table cellspacing="0" cellpadding="0" class="table_default">
                                    <thead>
                                        <tr>
                                            <th style="width: 15%;">객실명</th>
                                            <th style="width: 5%;">기준</th>
                                            <th style="width: 5%;">최대</th>
                                            <th style="width: 20%;">유형</th>
                                            <th style="width: 20%;">평형</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <!-- data-room-name / base-occupancy / max-occupancy / structure / size (size+"평") -->
                                            <td scope="row" data-room-name></td>
                                            <td data-room-base-occupancy></td>
                                            <td data-room-max-occupancy></td>
                                            <td data-room-structure></td>
                                            <td data-room-size></td>
                                        </tr>
                                    </tbody>
                                </table>
                                <ul class="table_text">
                                    <!-- data-* : data-room-amenities | rooms[j].amenities.join(', ') -->
                                    <li><strong>집기품목</strong> : <span data-room-amenities></span></li>
                                </ul>
                            </div>
                            <div class="price_table for_m">
                                <table cellspacing="0" cellpadding="0" class="table_default">
                                    <thead>
                                        <tr>
                                            <th>객실명</th>
                                            <th>기준</th>
                                            <th>최대</th>
                                            <th>유형</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td scope="row" data-room-name></td>
                                            <td data-room-base-occupancy></td>
                                            <td data-room-max-occupancy></td>
                                            <td data-room-structure></td>
                                        </tr>
                                    </tbody>
                                </table>
                                <ul class="table_text">
                                    <!-- data-* : data-room-amenities (모바일) -->
                                    <li><strong>집기품목</strong> : <span data-room-amenities></span></li>
                                </ul>
                            </div>
                            <!--div class="btn_wrap"><a href="https://www.bookingplay.co.kr/partner/item/9860/calendar_main/" target="_blank" class="btn_reserve">실시간 예약</a></div-->
                        </div>
                    </div>
                    <div class="memory">
                        <div class="cont">
                            <!-- data-* : data-room-memory-image | roomtypes[current] interior 이미지 (배경, 없으면 placeholder) -->
                            <div class="img fadeRight" data-scroll="" style="background-repeat:no-repeat;background-position:center 50%;" data-room-memory-image></div>
                            <p class="rtxt fadeUp" data-scroll="">추억을남기는<br>,<br>공간</p>
                        </div>
                    </div>
                    <div class="vimg">
                        <!-- data-* : data-room-vimg-title | pages.room[id].sections[0].hero.title (없으면 하드코딩 fallback) -->
                        <h4 class="fadeUp" data-scroll="" data-room-vimg-title>Make your romantic memory</h4>
                        <!-- data-* : data-room-vimg-desc | pages.room[id].sections[0].gallery.title (\n→<br>, 없으면 하드코딩 fallback) -->
                        <p class="stit fadeUp" data-scroll="" data-room-vimg-desc>감성 가득한 순간, <br>평생 잊지못할 낭만적인 추억을 만들어보세요. </p>
                        <!-- data-* : data-room-gallery | roomtypes[current] interior 이미지 (li 배경+img 동적, 없으면 placeholder) -->
                        <ul data-room-gallery></ul>
                        <!-- s: 객실 평면도 — 원본 객실 상세의 평면도 크롤링 이미지가 있을 때만 노출.
                             제목 영역 없이 도면 이미지 한 장만 놓는다. 없으면 매퍼가 구간째 숨긴다. -->
                        <div class="room_floorplan" data-room-floorplan-section style="display: none">
                          <!-- data-* : data-room-floorplan-image
                               roomtypes[current] 평면도 이미지 → 없으면 섹션 미노출 -->
                          <img alt="객실 평면도" data-room-floorplan-image />
                        </div>
                        <!--// 객실 평면도 -->
                    </div>
                </div>
                <!-- e: room-wrap -->
            </section>
            <!-- e: content -->
        </div>
        <div id="footer-wrap"></div>
    </div><!-- e: scroll-wrap -->
</div><!-- e: wrap -->
<!-- infra: SEO/헤더·푸터 동적 + 데이터 매핑 -->
<script src="js/image-helpers.js"></script>
<script src="js/preview-handler.js"></script>
<script src="js/data-mapper/core/base-mapper.js"></script>
<script src="js/data-mapper/pages/header-footer-mapper.js"></script>
<script src="js/data-mapper/pages/room-mapper.js"></script>
<script src="js/header-footer-loader.js"></script>
<script src="js/custom.js"></script>
</body>
</html>
